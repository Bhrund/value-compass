name: Update data
on:
  schedule: [{ cron: '30 22 * * 1-5' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
        env: { FMP_KEY: '${{ secrets.FMP_KEY }}', NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}' }
      - run: node scripts/congress.mjs
        continue-on-error: true
        env: { FMP_KEY: '${{ secrets.FMP_KEY }}', CONGRESS_KEY: '${{ secrets.CONGRESS_KEY }}', NTFY_TOPIC: '${{ secrets.NTFY_TOPIC }}' }
      - run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -A docs; git diff --cached --quiet || (git commit -m "Update data" && git push)
